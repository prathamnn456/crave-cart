name: Keep backend awake

# Pings the Render backend so its free instance doesn't spin down,
# which keeps the site's first load fast. Runs on a schedule and can
# also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "Pinging backend to keep it warm..."
          curl -sS -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://crave-cart-backend-xf9q.onrender.com/ || true
